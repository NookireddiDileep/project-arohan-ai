# Optional: run the calculator inside a CPU-only K3s / kind cluster.
# Step 1: kubectl create configmap ai01-roofline --from-file=roofline.py
# Step 2: kubectl apply -f job.yaml ; kubectl logs job/ai01-roofline
apiVersion: batch/v1
kind: Job
metadata:
  name: ai01-roofline
  labels:
    app.kubernetes.io/part-of: arohan-notes
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: roofline
          image: python:3.12-slim
          command: ["python3", "/work/roofline.py"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: code
              mountPath: /work
      volumes:
        - name: code
          configMap:
            name: ai01-roofline
