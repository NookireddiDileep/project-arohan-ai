apiVersion: apps/v1
kind: Deployment
metadata:
  name: arohan-baseline
  namespace: default
  labels:
    app.kubernetes.io/name: arohan-baseline
    app.kubernetes.io/part-of: project-arohan
    arohan.io/version: v0.1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arohan-baseline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arohan-baseline
        app.kubernetes.io/part-of: project-arohan
        arohan.io/version: v0.1
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
