server:
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClass: local-path

  retention: 7d

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

ruleFiles:
  arohan-reliability.rules.yaml: |
    groups:
      - name: arohan-workload-reliability
        interval: 30s
        rules:
          - alert: ArohanBaselineHighMemoryUtilization
            expr: |
              (
                100 * container_memory_working_set_bytes{
                  namespace="default",
                  container="nginx",
                  pod=~"arohan-baseline.*"
                }
                / on(namespace,pod,container)
                kube_pod_container_resource_limits{
                  namespace="default",
                  container="nginx",
                  pod=~"arohan-baseline.*",
                  resource="memory"
                }
              ) > 80
            for: 2m
            labels:
              severity: warning
              component: workload
              category: resource
            annotations:
              summary: "AROHAN baseline workload has high memory utilization"
              description: "The AROHAN baseline workload is using more than 80% of its configured memory limit for at least 2 minutes."

serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      - /etc/config/rules
      - /etc/config/alerts
      - /etc/config/arohan-reliability.rules.yaml