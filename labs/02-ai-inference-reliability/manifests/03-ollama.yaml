apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-lab
  labels: { app: ollama }
spec:
  replicas: 1
  strategy: { type: Recreate }        # RWO volume: avoid two pods fighting over it
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      priorityClassName: inference-critical
      containers:
      - name: ollama
        image: ollama/ollama:latest   # TODO: pin a specific tag from Docker Hub before committing
        ports:
        - containerPort: 11434
          name: http
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        - name: OLLAMA_MODELS
          value: /models               # explicit path; also matters on OpenShift (Part 6)
        - name: OLLAMA_KEEP_ALIVE
          value: "30m"                 # keep model in memory between requests
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests: { cpu: "1",  memory: 2Gi }
          limits:   { cpu: "2",  memory: 4Gi }
        startupProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 5
          failureThreshold: 24          # up to 2 min to start
        readinessProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /, port: http }
          periodSeconds: 20
          failureThreshold: 3
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-lab
spec:
  type: ClusterIP                       # internal only: never expose an unauthenticated model API publicly
  selector: { app: ollama }
  ports:
  - name: http
    port: 11434
    targetPort: http
