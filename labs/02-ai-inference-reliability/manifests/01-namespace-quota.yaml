apiVersion: v1
kind: Namespace
metadata:
  name: ai-lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-lab-quota
  namespace: ai-lab
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "3"
    pods: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-lab-defaults
  namespace: ai-lab
spec:
  limits:
  - type: Container
    default:        { cpu: "500m", memory: 512Mi }   # applied if a pod sets no limits
    defaultRequest: { cpu: "100m", memory: 128Mi }
    max:            { cpu: "2",    memory: 6Gi }
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: inference-critical
value: 100000
globalDefault: false
description: "Model-serving pods: preempt batch/test pods under pressure"
