# Exercise 5e: the 4-GPU pod again, now that one node is left completely free
apiVersion: v1
kind: Pod
metadata:
  name: big-train-packed
  namespace: sched-lab
spec:
  schedulerName: binpack-scheduler
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 200m, memory: 64Mi}
      limits: {nvidia.com/gpu: 4, memory: 64Mi}
