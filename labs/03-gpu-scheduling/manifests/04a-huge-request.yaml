# Exercise 4a: requests decide scheduling. Nodes are idle, but nobody has 200Gi allocatable.
apiVersion: v1
kind: Pod
metadata:
  name: huge-request
  namespace: sched-lab
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 200Gi}
      limits: {memory: 200Gi}
