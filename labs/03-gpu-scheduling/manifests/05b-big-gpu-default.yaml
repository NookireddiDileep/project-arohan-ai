# Exercise 5b: one 4-GPU training pod. 4 GPUs are free cluster-wide, but are they on ONE node?
apiVersion: v1
kind: Pod
metadata:
  name: big-train
  namespace: sched-lab
spec:
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 200m, memory: 64Mi}
      limits: {nvidia.com/gpu: 4, memory: 64Mi}
