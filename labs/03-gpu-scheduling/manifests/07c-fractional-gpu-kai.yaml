# Exercise 7c: KAI fractional GPUs. Four pods asking for half a GPU each.
# Expect: they pair up on shared physical (fake) GPUs. Default mode NonMemoryEnforced = NO memory isolation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: half-gpu-infer
  namespace: kai-lab
spec:
  replicas: 4
  selector:
    matchLabels: {app: half-gpu-infer}
  template:
    metadata:
      labels:
        app: half-gpu-infer
        kai.scheduler/queue: default-queue
      annotations:
        gpu-fraction: "0.5"
    spec:
      schedulerName: kai-scheduler
      automountServiceAccountToken: false
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          limits: {memory: 64Mi}
