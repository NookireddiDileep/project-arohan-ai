# Exercise 3a: toleration WITHOUT affinity. Tolerations permit, they don't attract.
# Expect replicas on the CPU node AND the GPU nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tolerate-only
  namespace: sched-lab
spec:
  replicas: 6
  selector:
    matchLabels: {app: tolerate-only}
  template:
    metadata:
      labels: {app: tolerate-only}
    spec:
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests: {cpu: 50m, memory: 16Mi}
          limits: {memory: 32Mi}
