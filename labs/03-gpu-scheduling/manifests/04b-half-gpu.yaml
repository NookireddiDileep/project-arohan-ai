# Exercise 4b: GPUs are integer extended resources. Expect the API server to REJECT this
# (it never reaches the scheduler).
apiVersion: v1
kind: Pod
metadata:
  name: half-gpu
  namespace: sched-lab
spec:
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      limits: {nvidia.com/gpu: "0.5"}
