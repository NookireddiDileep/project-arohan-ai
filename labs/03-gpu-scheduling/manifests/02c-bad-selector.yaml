# Exercise 2c: nodeSelector for a GPU model that doesn't exist in the cluster
apiVersion: v1
kind: Pod
metadata:
  name: wants-h100
  namespace: sched-lab
spec:
  nodeSelector:
    gpu-model: h100
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      limits: {nvidia.com/gpu: 1, memory: 64Mi}
