# Exercise 1b: spec.nodeName set at creation = the scheduler is skipped entirely.
# Target is a TAINTED GPU node and the pod has NO toleration. NoSchedule is enforced by the
# scheduler, which never runs for this pod, so the kubelet simply starts it.
apiVersion: v1
kind: Pod
metadata:
  name: bypass
  namespace: sched-lab
spec:
  nodeName: sched-lab-worker2
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 32Mi}
      limits: {memory: 64Mi}
