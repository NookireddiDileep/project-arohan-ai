# Exercise 5d: same four 1-GPU pods, scheduled by binpack-scheduler (expect 4 + 0)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: small-infer-packed
  namespace: sched-lab
spec:
  replicas: 4
  selector:
    matchLabels: {app: small-infer-packed}
  template:
    metadata:
      labels: {app: small-infer-packed}
    spec:
      schedulerName: binpack-scheduler
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests: {cpu: 200m, memory: 64Mi}
          limits: {nvidia.com/gpu: 1, memory: 64Mi}
