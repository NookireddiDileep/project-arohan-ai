# Exercise 4c: extended resources can't be overcommitted. request != limit is rejected.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-overcommit
  namespace: sched-lab
spec:
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {nvidia.com/gpu: 1}
      limits: {nvidia.com/gpu: 2}
