# Exercise 7 cluster: KAI Scheduler + run-ai fake-gpu-operator (8 fake GPUs per GPU worker).
# Node labels mirror KAI's own kind e2e config (hack/e2e-kind-config.yaml @ v0.19.0).
# kind create cluster --name kai-lab --image kindest/node:v1.35.0 --config manifests/07a-kind-kai-lab.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
  labels:
    run.ai/simulated-gpu-node-pool: default
    nvidia.com/gpu.deploy.device-plugin: "true"
    nvidia.com/gpu.memory: "11441"
- role: worker
  labels:
    run.ai/simulated-gpu-node-pool: default
    nvidia.com/gpu.deploy.device-plugin: "true"
    nvidia.com/gpu.memory: "11441"
- role: worker
  labels:
    node-type: cpu
