# Exercise 1c: a schedulerName nobody serves -> Pending forever with NO events
apiVersion: v1
kind: Pod
metadata:
  name: orphan
  namespace: sched-lab
spec:
  schedulerName: does-not-exist
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 32Mi}
      limits: {memory: 64Mi}
