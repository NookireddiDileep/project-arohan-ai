# Exercise 2a: more GPUs than any single node has (each GPU node has 4)
apiVersion: v1
kind: Pod
metadata:
  name: greedy
  namespace: sched-lab
spec:
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      limits: {nvidia.com/gpu: 8, memory: 64Mi}
