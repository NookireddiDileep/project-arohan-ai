# Exercise 1a: watch the normal path (Pending -> Scheduled -> Pulling -> Started)
apiVersion: v1
kind: Pod
metadata:
  name: plain
  namespace: sched-lab
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: 100m, memory: 32Mi}
      limits: {memory: 64Mi}
