# Exercise 5a: four 1-GPU inference pods with the DEFAULT scheduler (expect spreading, e.g. 2 + 2)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: small-infer
  namespace: sched-lab
spec:
  replicas: 4
  selector:
    matchLabels: {app: small-infer}
  template:
    metadata:
      labels: {app: small-infer}
    spec:
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests: {cpu: 200m, memory: 64Mi}
          limits: {nvidia.com/gpu: 1, memory: 64Mi}
