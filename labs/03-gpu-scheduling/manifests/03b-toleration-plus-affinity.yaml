# Exercise 3b: toleration (permit) + required node affinity (attract) = GPU nodes only
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tolerate-and-attract
  namespace: sched-lab
spec:
  replicas: 6
  selector:
    matchLabels: {app: tolerate-and-attract}
  template:
    metadata:
      labels: {app: tolerate-and-attract}
    spec:
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: node-type, operator: In, values: ["gpu"]}
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests: {cpu: 50m, memory: 16Mi}
          limits: {memory: 32Mi}
