name: lint

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck all Bash scripts
        run: |
          files=$(git ls-files '*.sh')
          if [ -z "$files" ]; then echo "No .sh files"; exit 0; fi
          shellcheck --severity=warning $files
      - name: Check relative Markdown links
        shell: bash
        run: |
          : > /tmp/broken
          while IFS= read -r f; do
            dir=$(dirname "$f")
            { grep -oE '\]\([^)#]+' "$f" || true; } | sed 's/^](//' | { grep -vE '^(https?:|mailto:)' || true; } | while IFS= read -r link; do
              link=${link%% *}
              [ -e "$dir/$link" ] || echo "BROKEN: $f -> $link" | tee -a /tmp/broken
            done
          done < <(git ls-files '*.md')
          if [ -s /tmp/broken ]; then exit 1; fi
          echo "All relative links OK"
      - name: Validate YAML manifests
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('labs/**/*.y*ml', recursive=True) + glob.glob('.github/**/*.y*ml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  print("BAD YAML:", f, e); bad = 1
          sys.exit(bad)
          PY
      - name: Validate Kubernetes manifests (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          files=$(git ls-files 'labs/*/kubernetes/*.yaml' 'labs/*/manifests/*.yaml')
          # CRDs (KAI) and kind/scheduler configs have no public schema: skipped, not failed
          ./kubeconform -summary -ignore-missing-schemas $files
      - name: Check Markdown code fences are closed
        shell: bash
        run: |
          bad=0
          while IFS= read -r f; do
            n=$(grep -c '^[[:space:]]*```' "$f" || true)
            if [ $((n % 2)) -ne 0 ]; then echo "UNCLOSED CODE FENCE: $f"; bad=1; fi
          done < <(git ls-files '*.md')
          exit $bad
